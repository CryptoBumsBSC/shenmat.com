name: Diagnose Shen Payload
on:
  push:
    branches:
      - shen-v5-1-deploy
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shen-v5-1-deploy
          fetch-depth: 0
      - name: Inspect historical payload
        shell: bash
        run: |
          set -euxo pipefail
          : > /tmp/site.b64
          for n in $(seq 0 15); do
            f=$(printf '.site-parts/part-%03d' "$n")
            git show a01d5fd2939704accbab0b4dff996b1c42d18490:"$f" >> /tmp/site.b64
          done
          wc -c /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.bin
          ls -l /tmp/site.bin
          file /tmp/site.bin
          gzip -t /tmp/site.bin
          tar -tzf /tmp/site.bin | head -100
